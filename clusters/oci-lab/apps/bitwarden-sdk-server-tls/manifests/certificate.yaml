apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-sdk-server-tls
  namespace: external-secrets
spec:
  # Secret name is fixed by the bitwarden-sdk-server chart's default
  # (values.yaml: tls.secretName). Self-signed leaf certs get ca.crt
  # populated in the same Secret — that's what SecretStore.caProvider
  # references, no separate CA cert needed.
  secretName: bitwarden-tls-certs
  dnsNames:
    - bitwarden-sdk-server.external-secrets.svc.cluster.local
    - bitwarden-sdk-server.external-secrets.svc
    - bitwarden-sdk-server
  issuerRef:
    name: bitwarden-sdk-server-selfsigned
    kind: Issuer
