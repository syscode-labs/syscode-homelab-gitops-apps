apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oci-lab-imp-crds
  namespace: argocd
  labels:
    syscode.io/cluster: oci-lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/imp.git
    targetRevision: v0.7.0 # HA operator
    path: config/crd/bases
  destination:
    name: oci-lab
    namespace: imp-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
