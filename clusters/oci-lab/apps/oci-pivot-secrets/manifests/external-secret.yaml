apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-pivot-controller-config
  namespace: oci-pivot-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-oci
    kind: ClusterSecretStore
  target:
    name: oci-pivot-controller-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: OCI_COMPARTMENT_ID
      remoteRef:
        key: "e2432bdb-b635-4049-94dd-b4a100e69991" # gitleaks:allow -- Bitwarden secret UUID, not a credential
