# oci-lab-only. ESO syncs oci-pivot-controller's Bitwarden-sourced secret.
# It stays unhealthy until secret zero (`bw-auth-token`) is restored. ESO is
# assigned an earlier sync wave so the ExternalSecret CRD exists first.
#
# Applied by unraid-lab's Argo (oci-raw lane) to the registered oci-lab
# cluster — oci-lab runs no local Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oci-lab-oci-pivot-secrets
  namespace: argocd
  labels:
    syscode.io/cluster: oci-lab
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps.git
    targetRevision: HEAD
    path: clusters/oci-lab/apps/oci-pivot-secrets/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: oci-pivot-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
