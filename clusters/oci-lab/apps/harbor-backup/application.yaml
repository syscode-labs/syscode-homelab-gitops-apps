# OCI-lab-only: deterministic Harbor PostgreSQL backups to OCI Object Storage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oci-lab-harbor-backup
  namespace: argocd
  labels:
    syscode.io/cluster: oci-lab
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps.git
    targetRevision: HEAD
    path: clusters/oci-lab/apps/harbor-backup/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
