apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oci-lab-imp-runners
  namespace: argocd
  labels:
    syscode.io/cluster: oci-lab
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps.git
    targetRevision: HEAD
    path: clusters/oci-lab/apps/imp-runners/manifests
  destination:
    name: oci-lab
    namespace: github-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
