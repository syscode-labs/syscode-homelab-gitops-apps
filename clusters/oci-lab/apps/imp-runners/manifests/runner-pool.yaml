apiVersion: v1
kind: Namespace
metadata:
  name: github-runners
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-runner-token
  namespace: github-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-oci
    kind: ClusterSecretStore
  target:
    name: github-runner-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: "03fd2ea5-c43c-4fd8-a9a3-b4b700a80b07" # gitleaks:allow -- Bitwarden secret UUID, not a credential
---
apiVersion: imp.dev/v1alpha1
kind: ImpVMClass
metadata:
  name: github-runner-small
  namespace: github-runners
spec:
  vcpu: 1
  memoryMiB: 512
  diskGiB: 5
---
apiVersion: imp.dev/v1alpha1
kind: ImpVMTemplate
metadata:
  name: github-runner
  namespace: github-runners
spec:
  classRef:
    name: github-runner-small
  image: ghcr.io/syscode-labs/imp-runner:latest
---
apiVersion: imp.dev/v1alpha1
kind: ImpVMRunnerPool
metadata:
  name: github-actions
  namespace: github-runners
spec:
  templateName: github-runner
  platform:
    type: github-actions
    scope:
      org: syscode-labs
    credentialsSecret: github-runner-token
  scaling:
    mode: polling
    minIdle: 1
    maxConcurrent: 1
    scaleUpStep: 1
    cooldownSeconds: 30
