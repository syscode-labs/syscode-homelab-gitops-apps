# This reuses the existing OCI Bitwarden machine-account token secret. The
# token is secret zero and stays out of Git; ESO replaces only its consumer.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-oci
spec:
  conditions:
    - namespaces: ["oci-pivot-system"]
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      auth:
        secretRef:
          credentials:
            name: bw-auth-token
            key: token
            namespace: oci-pivot-system
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        key: ca.crt
        namespace: external-secrets
      organizationID: 28d10c96-b6fb-4e33-b486-b1f700017837
      projectID: e3948052-3ef9-4cab-9f09-b4a100eb52a6
