# Bitwarden Secrets Manager supplies Grafana Cloud credentials to OCI Alloy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oci-lab-grafana-cloud-secrets
  namespace: argocd
  labels:
    syscode.io/cluster: oci-lab
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps.git
    targetRevision: HEAD
    path: clusters/oci-lab/apps/grafana-cloud-secrets/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
