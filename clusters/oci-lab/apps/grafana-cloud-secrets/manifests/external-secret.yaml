apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-oci
    kind: ClusterSecretStore
  target:
    name: grafana-cloud
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: metrics-username
      remoteRef:
        key: "233f03d8-a66b-4ac9-8b49-b4c30181cce7" # gitleaks:allow
    - secretKey: metrics-password
      remoteRef:
        key: "bff3f906-0f85-4dd1-abce-b4c30181cd5c" # gitleaks:allow
    - secretKey: logs-username
      remoteRef:
        key: "eef52e57-b1a6-4efc-8fc1-b4b700eb8a45" # gitleaks:allow
    - secretKey: logs-password
      remoteRef:
        key: "5af64597-2c3d-4b13-aba1-b4b700eb8b11" # gitleaks:allow
