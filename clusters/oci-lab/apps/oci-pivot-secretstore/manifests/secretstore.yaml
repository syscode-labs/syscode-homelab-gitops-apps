apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bitwarden-secretsmanager
  namespace: oci-pivot-system
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        namespace: external-secrets
        key: ca.crt
      auth:
        secretRef:
          credentials:
            key: token
            name: bitwarden-access-token
      # verify: fill in from your Bitwarden Secrets Manager org before this
      # store goes healthy. Never commit real values here — see
      # add-external-secrets-bitwarden/design.md's secret-zero decision.
      organizationID: "REPLACE_ME"
      projectID: "REPLACE_ME"
