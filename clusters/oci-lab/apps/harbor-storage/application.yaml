apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oci-lab-harbor-storage
  namespace: argocd
  labels:
    syscode.io/cluster: oci-lab
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps.git
    targetRevision: HEAD
    path: clusters/oci-lab/apps/harbor-storage/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - ServerSideApply=true
