apiVersion: v1
kind: PersistentVolume
metadata:
  name: oci-lab-harbor-redis
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: harbor
    name: data-oci-lab-harbor-redis-0
    uid: 5dce0d11-96f3-48da-8d24-7876e526efc7
  local:
    path: /var/mnt/harbor-redis
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ampere-vnic-1
