# Single cluster-scoped provider auth. caProvider reads the CA from the same
# cert-managed secret the sdk-server serves with — no inline caBundle drift.
# Bootstrap token Secret `bws-token` is applied out-of-band once per cluster
# from syscod3/homelab-secrets (SOPS). See openspec change
# eso-bitwarden-unraid-lab.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  conditions:
    - namespaces: ["monitoring", "argocd", "external-secrets"]
  provider:
    bitwardensecretsmanager:
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      auth:
        secretRef:
          credentials:
            name: bws-token
            key: token
            namespace: external-secrets
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        key: ca.crt
        namespace: external-secrets
      organizationID: 28d10c96-b6fb-4e33-b486-b1f700017837
      projectID: 8e33ca9c-37d5-4437-a977-b4a101001e2f
