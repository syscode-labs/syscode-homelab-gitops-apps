# External Secrets Operator + Bitwarden SDK server companion.
# Single ClusterSecretStore "bitwarden" authenticates from one bootstrap
# token (SOPS-encrypted in syscod3/homelab-secrets). See openspec change
# eso-bitwarden-unraid-lab.
# Chart is vendored (vendor/external-secrets) — the public helm repo host is
# not reliably resolvable from this cluster's egress, and vendoring pins the
# exact sdk-server v0.6.0 dependency.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps.git
      targetRevision: HEAD
      path: vendor/external-secrets
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/clusters/unraid-lab/apps/external-secrets/values.yaml
    - repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps.git
      targetRevision: HEAD
      path: clusters/unraid-lab/apps/external-secrets/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
