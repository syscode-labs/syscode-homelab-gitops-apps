# Registers the oci-lab external cluster with unraid-lab's Argo CD.
#
# oci-lab runs NO local Argo CD; this Secret is what lets unraid's Argo
# reconcile it (ApplicationSet destination `name: oci-lab`, oci-raw /
# oci-bootstrap lanes). Endpoint is Omni's Kubernetes API Proxy, never an
# OCI control-plane address. The credential is an Omni service-account token
# mapped to the argocd-oci group on oci-lab.
#
# The bearer token is a long-lived Omni service-account token, generated
# outside Git and stored in Bitwarden. Stays unhealthy until Bitwarden contains
# the separate proxy server, CA, and token secrets referenced below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-lab-cluster
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: oci-lab-cluster
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          # Makes unraid-lab's Argo CD treat this Secret as a cluster registration.
          argocd.argoproj.io/secret-type: cluster
      type: Opaque
      data:
        name: oci-lab
        server: "{{ .server }}"
        config: |
          {"tlsClientConfig": {"insecure": false, "caData": "{{ .ca }}", "bearerToken": "{{ .token }}"}}
  data:
    - secretKey: server
      remoteRef:
        key: "817bc3d5-0e06-4bea-abfb-b4b600a39165" # gitleaks:allow -- Bitwarden secret UUID, not a credential
    - secretKey: ca
      remoteRef:
        key: "979fe9de-2c24-4806-8402-b4b600a3919d" # gitleaks:allow -- Bitwarden secret UUID, not a credential
    - secretKey: token
      remoteRef:
        key: "f42aff26-639b-454a-a6d6-b4b600a391d8" # gitleaks:allow -- Bitwarden secret UUID, not a credential
