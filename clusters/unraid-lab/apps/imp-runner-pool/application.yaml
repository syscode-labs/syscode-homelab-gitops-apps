apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unraid-lab-imp-runner-pool
  namespace: argocd
  labels:
    syscode.io/cluster: unraid-lab
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps.git
    targetRevision: HEAD
    path: clusters/unraid-lab/apps/imp-runner-pool/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: imp-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
