# unraid-lab-only. Syncs bootstrap/ to the oci-lab EXTERNAL cluster —
# but ONLY the Tailscale bits. bootstrap/argocd-cm.yaml and
# bootstrap/argocd-rbac-cm.yaml configure unraid's LOCAL Argo CD
# (PocketID URL, RBAC) and must not land on oci-lab, which runs no Argo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oci-bootstrap
  namespace: argocd
  labels:
    syscode.io/cluster: unraid-lab
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps.git
    targetRevision: HEAD
    path: bootstrap
    directory:
      include: "tailscale-*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
