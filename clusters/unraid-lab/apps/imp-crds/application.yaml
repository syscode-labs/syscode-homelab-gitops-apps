apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: imp-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/imp.git
    targetRevision: d42af48e9415a962175686d15a7b6cbc53f2efc0 # VTEP guardrail canary (adds spec.vtepIP)
    path: config/crd/bases
  destination:
    server: https://kubernetes.default.svc
    namespace: imp-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
