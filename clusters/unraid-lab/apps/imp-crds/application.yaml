apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unraid-lab-imp-crds
  namespace: argocd
  labels:
    syscode.io/cluster: unraid-lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/imp.git
    targetRevision: be193a77af360144f5b0cbf354a80ac720822163
    path: config/crd/bases
  destination:
    name: unraid-lab
    namespace: imp-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
