apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unraid-lab-imp-crds
  namespace: argocd
  labels:
    syscode.io/cluster: unraid-lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/imp.git
    targetRevision: b86ab24ff584d5116376e6b890f40da081922a59
    path: config/crd/bases
  destination:
    server: https://kubernetes.default.svc
    namespace: imp-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
