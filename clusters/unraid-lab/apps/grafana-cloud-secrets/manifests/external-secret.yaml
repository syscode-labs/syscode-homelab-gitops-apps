# Grafana Cloud credentials for Alloy, synced from Bitwarden Secrets Manager
# via the shared ClusterSecretStore. Replaces the former sm-operator
# BitwardenSecret (openspec change eso-bitwarden-unraid-lab).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: grafana-cloud
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: metrics-username
      remoteRef:
        key: "586aca5a-53d4-486f-9215-b4a3012b4d6e" # gitleaks:allow -- Bitwarden secret UUID, not a credential
    - secretKey: metrics-password
      remoteRef:
        key: "0167adff-e881-4263-a8a6-b4a3012b4dac" # gitleaks:allow -- Bitwarden secret UUID, not a credential
    - secretKey: logs-username
      remoteRef:
        key: "1e7d563b-3318-4702-b5a3-b4a3012b4dea" # gitleaks:allow -- Bitwarden secret UUID, not a credential
    - secretKey: logs-password
      remoteRef:
        key: "a690572b-f1c1-4b3b-ae2e-b4a3012b4e2e" # gitleaks:allow -- Bitwarden secret UUID, not a credential
    - secretKey: otlp-username
      remoteRef:
        key: "7d06095d-73a5-4ead-909b-b4a3012b4e63" # gitleaks:allow -- Bitwarden secret UUID, not a credential
    - secretKey: otlp-password
      remoteRef:
        key: "fb9fd11c-d1b5-4359-9928-b4a3012b6c7c" # gitleaks:allow -- Bitwarden secret UUID, not a credential
    - secretKey: fleet-username
      remoteRef:
        key: "b39c9e04-299d-43e6-b675-b4a3012b4ecc" # gitleaks:allow -- Bitwarden secret UUID, not a credential
    - secretKey: fleet-password
      remoteRef:
        key: "2994fb3e-8eb0-4f30-b287-b4a3012b4f07" # gitleaks:allow -- Bitwarden secret UUID, not a credential
