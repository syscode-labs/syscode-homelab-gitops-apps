# GitHub App credentials from the packed Bitwarden secret.
# BWS value layout: line 1 = App ID, line 2 = client secret, lines 3+ = PEM key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-imp-runners
  namespace: imp-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: github-imp-runners
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        github-app-id: "4795312"
        github-app-installation-id: "158305388"
        github-app-private-key: '{{ join "\n" (slice (splitList "\n" .token) 2) }}'
  data:
    - secretKey: token
      remoteRef:
        key: "568897fe-83a0-4e9b-ba18-b4b80117472b" # gitleaks:allow -- Bitwarden secret UUID, not a credential
