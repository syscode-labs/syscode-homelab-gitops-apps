# ArgoCD ↔ PocketID OIDC client credentials, synced from Bitwarden Secrets
# Manager via the shared ClusterSecretStore. ESO templates the part-of label
# that Argo CD's `$secretName:key` oidc.config reference requires — replaces
# both the former sm-operator BitwardenSecret and its PostSync labeler Job.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-pocketid-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: argocd-pocketid-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      type: Opaque
  data:
    - secretKey: clientSecret
      remoteRef:
        key: "486304eb-eacb-4734-8551-b4a3016fc6ee" # gitleaks:allow -- Bitwarden secret UUID, not a credential
