# Supplies the PocketID OIDC client secret to Argo CD via Bitwarden Secrets
# Manager, without storing the value in Git. See design.md in
# syscode-ai-internal-plans/projects/syscode-homelab-gitops-apps/openspec/changes/argocd-pocketid-sso/
# for why the label-hook Job exists.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unraid-lab-argocd-oidc-secrets
  namespace: argocd
  labels:
    syscode.io/cluster: unraid-lab
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps.git
    targetRevision: HEAD
    path: clusters/unraid-lab/apps/argocd-oidc-secrets/manifests
  destination:
    name: unraid-lab
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
