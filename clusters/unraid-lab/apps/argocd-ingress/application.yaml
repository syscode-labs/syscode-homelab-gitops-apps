# unraid-lab-only. Tailscale ingress for the Argo CD UI — Argo CD itself is
# seeded via Talos inline-manifests, not a chart-app, so it has no
# values-driven ingress like radar/hubble; this is a plain raw manifest.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unraid-lab-argocd-ingress
  namespace: argocd
  labels:
    syscode.io/cluster: unraid-lab
spec:
  project: default
  source:
    repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps.git
    targetRevision: HEAD
    path: clusters/unraid-lab/apps/argocd-ingress/manifests
  destination:
    name: unraid-lab
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
