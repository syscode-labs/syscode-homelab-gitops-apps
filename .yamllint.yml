extends: default

# Vendored third-party charts keep upstream style; local pre-commit already
# excludes them — keep CI consistent.
ignore: |
  vendor/

rules:
  line-length:
    max: 120
    level: warning
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
