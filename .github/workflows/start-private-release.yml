name: Start private Talos release controller

on:
  pull_request:
    types: [closed]
    paths:
      - omni/versions.yaml
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merge SHA of an already-approved, merged versions.yaml PR.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Verify a manual replay names an approved versions source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          sha = os.environ['SOURCE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('source_sha must be a lowercase 40-character SHA')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          api(f'repos/{os.environ["GITHUB_REPOSITORY"]}/commits/{sha}')
          prs = api(f'repos/{os.environ["GITHUB_REPOSITORY"]}/commits/{sha}/pulls')
          approved = [pr for pr in prs if pr.get('base', {}).get('ref') == 'main' and pr.get('merged_at')]
          if not approved:
              raise SystemExit('source SHA is not associated with a merged main PR')
          if not any(any(f.get('filename') == 'omni/versions.yaml' for f in api(f'repos/{os.environ["GITHUB_REPOSITORY"]}/pulls/{pr["number"]}/files')) for pr in approved):
              raise SystemExit('source SHA is not associated with a merged versions.yaml PR')
          PY

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_CONTROLLER_APP_ID }}
          private-key: ${{ secrets.RELEASE_CONTROLLER_APP_PRIVATE_KEY }}
          owner: syscode-labs
          repositories: talos-release-controller

      - name: Dispatch sanitized release request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          RELEASE_ID: talos-${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > dispatch.json
          import json, os
          versions = {}
          current = None
          for line in open('omni/versions.yaml', encoding='utf-8'):
              if line.startswith('talos: '):
                  versions['talos_version'] = line.split(':', 1)[1].strip()
              elif line.startswith('kubernetes: '):
                  versions['kubernetes_version'] = line.split(':', 1)[1].strip()
          if not versions.get('talos_version') or not versions.get('kubernetes_version'):
              raise SystemExit('global Talos/Kubernetes pins are required')
          payload = {
              'release_id': os.environ['RELEASE_ID'],
              'source_repo': 'syscode-labs/syscode-homelab-gitops-apps',
              'source_sha': os.environ['SOURCE_SHA'],
              **versions,
          }
          print(json.dumps({'event_type': 'talos-release-start', 'client_payload': payload}))
          PY
          gh api repos/syscode-labs/talos-release-controller/dispatches \
            --method POST --input dispatch.json
