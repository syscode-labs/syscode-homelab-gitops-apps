# oci-lab-only: run the vCluster syncer on the control-plane node (worker node
# is 1 vCPU and near-full). CP node has ~390m free.
controlPlane:
  statefulSet:
    scheduling:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    # Right-sized requests — cheap insurance while the CP node stays a 1 vCPU node.
    resources:
      requests:
        cpu: 40m
        memory: 128Mi
