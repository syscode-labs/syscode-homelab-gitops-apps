operator:
  # OCI currently has one schedulable Imp worker; two anti-affined replicas
  # cannot both schedule until a second eligible worker exists.
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      memory: "256Mi"
agent:
  env:
    kernelPath: /usr/local/share/imp/vmlinux
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false
