# oci-lab-only: run Harbor on CP node. Registry blobs/charts use OCI Object Storage.

externalURL: https://harbor.wind-bearded.ts.net

expose:
  type: ingress
  tls:
    enabled: true
    certSource: none
  ingress:
    hosts:
      core: harbor.wind-bearded.ts.net
    className: tailscale
    annotations:
      tailscale.com/proxy-class: hubble-kernel-net

# Registry blobs/charts persist in OCI Object Storage. Harbor metadata remains
# node-local for now.
persistence:
  enabled: true
  imageChartStorage:
    type: s3
    disableredirect: false
    s3:
      region: uk-london-1
      regionendpoint: https://lrbmlfacfnqw.compat.objectstorage.uk-london-1.oraclecloud.com
      bucket: harbor-registry
      existingSecret: harbor-object-storage
      secure: true
      v4auth: true
      rootdirectory: harbor


# No vulnerability database/scanner on small OCI cluster.
trivy:
  enabled: false

# CP node is tainted; worker is only 1 vCPU.
# Reused by each Harbor component below.
x-harborNodeSelector: &harborNodeSelector
  node-role.kubernetes.io/control-plane: ""
x-harborTolerations: &harborTolerations
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

portal:
  nodeSelector: *harborNodeSelector
  tolerations: *harborTolerations
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
core:
  nodeSelector: *harborNodeSelector
  tolerations: *harborTolerations
  resources:
    requests:
      cpu: 40m
      memory: 96Mi
jobservice:
  nodeSelector: *harborNodeSelector
  tolerations: *harborTolerations
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
registry:
  nodeSelector: *harborNodeSelector
  tolerations: *harborTolerations
  registry:
    resources:
      requests:
        cpu: 30m
        memory: 64Mi
  controller:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
database:
  internal:
    nodeSelector: *harborNodeSelector
    tolerations: *harborTolerations
    resources:
      requests:
        cpu: 40m
        memory: 128Mi
redis:
  internal:
    nodeSelector: *harborNodeSelector
    tolerations: *harborTolerations
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
exporter:
  nodeSelector: *harborNodeSelector
  tolerations: *harborTolerations
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
