# Unraid Talos cluster identity.
proxyConfig:
  defaultTags: "tag:k8s-operator"

# The operator may use general control-plane nodes, never the IMP runner.
operatorConfig:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: imp.dev/runner
                operator: DoesNotExist
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
