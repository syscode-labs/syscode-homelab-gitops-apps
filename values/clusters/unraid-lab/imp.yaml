operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:e3479d962df779160547845e1f3f715e9b366acbba7cae087ff232029cb0f343

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:99e8675e1247b8de3c36405d3b3e4ab0fc0d9446c2bff92b959b04e5533a073a
  env:
    kernelPath: /usr/local/share/imp/vmlinux

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:99e8675e1247b8de3c36405d3b3e4ab0fc0d9446c2bff92b959b04e5533a073a

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 3

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Opt-in pressure lifecycle stays disabled until evaluated (openspec:
# memory-pressure-guardrails).
pressureLifecycle:
  enabled: false
