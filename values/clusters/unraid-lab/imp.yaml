operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:6200bf562d99baf4307c2997a14fb3b2b7e8795f23372ebcef4b0e60711ed5e6

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:1f921d79c56d91506fc85d4704f6823b297ce4c8510935ba60f27734a5707892
  env:
    kernelPath: /usr/local/share/imp/vmlinux
  nodeSelector:
    imp/enabled: null
    imp.dev/runner: "true"
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:1f921d79c56d91506fc85d4704f6823b297ce4c8510935ba60f27734a5707892
  nodeSelector:
    imp/enabled: null
    imp.dev/runner: "true"
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 1
    nodeSelector:
      imp/enabled: null
      imp.dev/runner: "true"
    tolerations:
      - key: imp.dev/runner
        operator: Equal
        value: "true"
        effect: NoSchedule

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Opt-in pressure lifecycle stays disabled until evaluated (openspec:
# memory-pressure-guardrails).
pressureLifecycle:
  enabled: false
