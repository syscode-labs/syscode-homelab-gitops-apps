operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:ddb0c163bb47910a546ccbe08b25ec754e7cc547af5e877f3a4534c4e4c0fba7
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:3075e4b692b57c21171f71d3c553ae7dd32b05f4e549eb1069294d0ca1b99bbd
  env:
    kernelPath: /usr/local/share/imp/vmlinux
  nodeSelector:
    imp/enabled: null
    imp.dev/runner: "true"
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:3075e4b692b57c21171f71d3c553ae7dd32b05f4e549eb1069294d0ca1b99bbd
  nodeSelector:
    imp/enabled: null
    imp.dev/runner: "true"
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 1
    nodeSelector:
      imp/enabled: null
      imp.dev/runner: "true"
    tolerations:
      - key: imp.dev/runner
        operator: Equal
        value: "true"
        effect: NoSchedule

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Opt-in pressure lifecycle stays disabled until evaluated (openspec:
# memory-pressure-guardrails).
pressureLifecycle:
  enabled: false
