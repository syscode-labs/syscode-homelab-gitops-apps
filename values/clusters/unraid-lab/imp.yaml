operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:6200bf562d99baf4307c2997a14fb3b2b7e8795f23372ebcef4b0e60711ed5e6
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:21443c17cf312c1f370c68c5480ea0b97f827c4739f3163b25c161e20f3f4bff
  env:
    kernelPath: /usr/local/share/imp/vmlinux
  nodeSelector:
    imp/enabled: null
    imp.dev/runner: "true"
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:21443c17cf312c1f370c68c5480ea0b97f827c4739f3163b25c161e20f3f4bff
  nodeSelector:
    imp/enabled: null
    imp.dev/runner: "true"
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 1
    nodeSelector:
      imp/enabled: null
      imp.dev/runner: "true"
    tolerations:
      - key: imp.dev/runner
        operator: Equal
        value: "true"
        effect: NoSchedule

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Opt-in pressure lifecycle stays disabled until evaluated (openspec:
# memory-pressure-guardrails).
pressureLifecycle:
  enabled: false
