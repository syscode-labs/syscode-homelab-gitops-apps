operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:c8a382d25393adab23baa52b3bb0680274c9124379ae16f6ac16242ede81c590

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:42440fb4b4a3a34967ef36cae7a0fc2c33f18104fe8e061b44003f3813e7f9b3
  env:
    kernelPath: /usr/local/share/imp/vmlinux

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:42440fb4b4a3a34967ef36cae7a0fc2c33f18104fe8e061b44003f3813e7f9b3

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 3

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Opt-in pressure lifecycle stays disabled until evaluated (openspec:
# memory-pressure-guardrails).
pressureLifecycle:
  enabled: false
