operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:d3f6ba8c376b971feb94de0d9e40a730b6b5c1c3917d62eac78d23fa74f95837
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:f9d31a9624f9ab561216f1498372bf235d588588418d4914b211b719ceeb3dcc
  env:
    kernelPath: /usr/local/share/imp/vmlinux
  nodeSelector:
    imp/enabled: null
    imp.dev/runner: "true"
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:f9d31a9624f9ab561216f1498372bf235d588588418d4914b211b719ceeb3dcc
  nodeSelector:
    imp/enabled: null
    imp.dev/runner: "true"
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 1
    nodeSelector:
      imp/enabled: null
      imp.dev/runner: "true"
    tolerations:
      - key: imp.dev/runner
        operator: Equal
        value: "true"
        effect: NoSchedule

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Opt-in pressure lifecycle stays disabled until evaluated (openspec:
# memory-pressure-guardrails).
pressureLifecycle:
  enabled: false
