operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:7bc738aa09a852c9b06c8140cb9f70e79f3adecc66c3c1d7234a5cc5d46fb54e

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:c9bfe0fb3ff508de0ec85e4cf0beefb35c058840447c91e2062229446e758205
  env:
    kernelPath: /usr/local/share/imp/vmlinux

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:c9bfe0fb3ff508de0ec85e4cf0beefb35c058840447c91e2062229446e758205

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 3

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Opt-in pressure lifecycle stays disabled until evaluated (openspec:
# memory-pressure-guardrails).
pressureLifecycle:
  enabled: false
