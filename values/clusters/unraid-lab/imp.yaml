agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:55482a8e413f86df54ad46123199c6fc5f13c646985d03280a8fe501c43bd23e
  env:
    kernelPath: /usr/local/share/imp/vmlinux

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:55482a8e413f86df54ad46123199c6fc5f13c646985d03280a8fe501c43bd23e

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 3

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false
