operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:d942d63f0ffb8774f33951e31e2a6f6984ca11140e1604b41d29d9222125e0f4

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:ca5c1843d8ce16b8db4a88ebe75b064b5ac20f5d36433e206901ee771d7a4f7b
  env:
    kernelPath: /usr/local/share/imp/vmlinux

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:ca5c1843d8ce16b8db4a88ebe75b064b5ac20f5d36433e206901ee771d7a4f7b

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 3

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Opt-in pressure lifecycle stays disabled until evaluated (openspec:
# memory-pressure-guardrails).
pressureLifecycle:
  enabled: false
