operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:4c4c7ab8866873dfac630e41ce98fe00da67be4c27687f9fe636e7529c0b0b6d

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:bb1049b58e4675c8973195f9fde05d1a68c1acbaa59c48b203058a87950e87d0
  env:
    kernelPath: /usr/local/share/imp/vmlinux

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 3

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false
