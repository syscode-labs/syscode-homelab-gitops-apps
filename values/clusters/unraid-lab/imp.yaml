operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:776cab3039e6f6a9a2f290421863b0a1714073c27509ec29b34a849ea4a13a4e

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:a2d379d8033639de4174765c62dc92e3285310a2c0a7392efdecd41f9828ab5c
  env:
    kernelPath: /usr/local/share/imp/vmlinux

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:a2d379d8033639de4174765c62dc92e3285310a2c0a7392efdecd41f9828ab5c

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 3

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Opt-in pressure lifecycle stays disabled until evaluated (openspec:
# memory-pressure-guardrails).
pressureLifecycle:
  enabled: false
