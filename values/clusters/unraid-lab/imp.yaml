    repository: ghcr.io/syscode-labs/imp-agent@sha256:e000f6219b7fd3d45dbe055e1c4489d5c4e850b94e602d8d2df179ee758957df
  env:
    kernelPath: /usr/local/share/imp/vmlinux

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:e000f6219b7fd3d45dbe055e1c4489d5c4e850b94e602d8d2df179ee758957df

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 3

