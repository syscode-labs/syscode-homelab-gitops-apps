operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:ad3a0cc392d6a1956e66a57522d24da12141b128fe9c8b15966569003466020d

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:326ed2e5fea1a579696d8a135e0e054822c26b9c38585f63cb442fb83d8d2cb8
  env:
    kernelPath: /usr/local/share/imp/vmlinux

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:326ed2e5fea1a579696d8a135e0e054822c26b9c38585f63cb442fb83d8d2cb8

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 3

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Opt-in pressure lifecycle stays disabled until evaluated (openspec:
# memory-pressure-guardrails).
pressureLifecycle:
  enabled: false
