operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:768619b098de3f402aaa835754b355f7bcdfd57f52ec0955a217a61d5fd9027e
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:fe23305b3a6ffaa8a7b7718da4690da1acfc09f75fbdfb0f0a323f3f788b3a55
  env:
    kernelPath: /usr/local/share/imp/vmlinux
  nodeSelector:
    imp/enabled: null
    imp.dev/runner: "true"
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:fe23305b3a6ffaa8a7b7718da4690da1acfc09f75fbdfb0f0a323f3f788b3a55
  nodeSelector:
    imp/enabled: null
    imp.dev/runner: "true"
  tolerations:
    - key: imp.dev/runner
      operator: Equal
      value: "true"
      effect: NoSchedule

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 1
    nodeSelector:
      imp/enabled: null
      imp.dev/runner: "true"
    tolerations:
      - key: imp.dev/runner
        operator: Equal
        value: "true"
        effect: NoSchedule

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Opt-in pressure lifecycle stays disabled until evaluated (openspec:
# memory-pressure-guardrails).
pressureLifecycle:
  enabled: false
