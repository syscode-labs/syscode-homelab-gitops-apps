operator:
  image:
    repository: ghcr.io/syscode-labs/imp-operator@sha256:585dfe70f06743be77c84a2458301db47e43998668733f21b5f270a536d751d9

agent:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:2253f9225004948aa077797f3177155db25aa2a61f3c90a28ce460fb60a4f863
  env:
    kernelPath: /usr/local/share/imp/vmlinux

runtime:
  image:
    repository: ghcr.io/syscode-labs/imp-agent@sha256:2253f9225004948aa077797f3177155db25aa2a61f3c90a28ce460fb60a4f863

kvm:
  preflight:
    enabled: true
    minVerifiedNodes: 3

# Grafana Kubernetes Monitoring scrapes the endpoints directly; this cluster
# does not install Prometheus Operator CRDs.
metrics:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Opt-in pressure lifecycle stays disabled until evaluated (openspec:
# memory-pressure-guardrails).
pressureLifecycle:
  enabled: false
