# Keep cert-manager on the two non-Imp control-plane nodes.
tolerations: &control_plane_toleration
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

webhook:
  tolerations: *control_plane_toleration

cainjector:
  tolerations: *control_plane_toleration

startupapicheck:
  tolerations: *control_plane_toleration
