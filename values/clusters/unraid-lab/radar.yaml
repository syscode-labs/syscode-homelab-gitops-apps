ingress:
  annotations:
    tailscale.com/proxy-class: hubble-kernel-net
  hosts:
    - host: radar-unraid-lab.wind-bearded.ts.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - radar-unraid-lab.wind-bearded.ts.net

# Radar may use general control-plane nodes, never the IMP runner.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: imp.dev/runner
              operator: DoesNotExist

resources:
  requests:
    cpu: 50m
    memory: 64Mi
