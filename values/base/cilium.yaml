# Talos-specific Cilium configuration
# Ref: https://www.talos.dev/v1.12/kubernetes-guides/network/deploying-cilium/

kubeProxyReplacement: true

# Talos local API server endpoint
k8sServiceHost: localhost
k8sServicePort: "7445"

# Talos cgroup v2 configuration
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# IPAM mode for Talos
ipam:
  mode: kubernetes

# Tunnel routing (compatible with OCI VCN networking).
# `tunnel: vxlan` was removed in Cilium 1.15 — split into routingMode + tunnelProtocol.
routingMode: tunnel
tunnelProtocol: vxlan

# Omni's SideroLink interface is MTU 1280. Keep pod networking sized for the
# physical 1500-byte NIC and VXLAN encapsulation instead.
MTU: 1450

# Security contexts required by Talos
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Hubble observability
hubble:
  enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - icmp
      - httpV2
    enableOpenMetrics: true
  relay:
    enabled: true
    prometheus:
      enabled: true
  ui:
    enabled: true

# Alloy discovers the chart's annotated Cilium and Hubble metric endpoints.
prometheus:
  enabled: true
