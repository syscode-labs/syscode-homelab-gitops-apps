# Grafana Cloud destinations use the Omni-delivered grafana-cloud Secret.
cluster:
  name: unraid-lab

# Alloy node/log collectors require host mounts and NET_RAW, so this namespace
# must opt into the Pod Security level that permits those scoped capabilities.
extraObjects:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: monitoring
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged

destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: https://prometheus-prod-55-prod-gb-south-1.grafana.net/api/prom/push
    auth:
      type: basic
      usernameKey: metrics-username
      passwordKey: metrics-password
    secret:
      create: false
      name: grafana-cloud
      namespace: monitoring
  grafana-cloud-logs:
    type: loki
    url: https://logs-prod-035.grafana.net/loki/api/v1/push
    auth:
      type: basic
      usernameKey: logs-username
      passwordKey: logs-password
    secret:
      create: false
      name: grafana-cloud
      namespace: monitoring
clusterMetrics:
  enabled: true
  collector: alloy-metrics
hostMetrics:
  enabled: true
  collector: alloy-metrics
clusterEvents:
  enabled: true
  collector: alloy-singleton
podLogsViaLoki:
  enabled: false
annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics
  namespaces: [kube-system]
  pods:
    enabled: false
  services:
    labelSelectors:
      k8s-app: hubble

collectors:
  alloy-metrics:
    presets: [clustered, statefulset]
    # Talos does not publish etcd as a Kubernetes Pod, so Grafana's etcd
    # integration cannot discover it. Scrape the three control-plane listeners
    # directly; access is limited by the accompanying Talos and Cilium policies.
    extraConfig: |
      discovery.static "talos_etcd" {
        targets = [
          { "__address__" = "192.168.122.109:2381", "instance" = "unraid-lab-control-planes-gwvq7k", "job" = "integrations/etcd" },
          { "__address__" = "192.168.122.190:2381", "instance" = "unraid-lab-control-planes-hqf6vh", "job" = "integrations/etcd" },
          { "__address__" = "192.168.122.214:2381", "instance" = "unraid-lab-control-planes-htvzs7", "job" = "integrations/etcd" },
        ]
      }

      prometheus.scrape "talos_etcd" {
        targets = discovery.static.talos_etcd.targets
        scrape_interval = "60s"
        scrape_timeout = "10s"
        scrape_protocols = ["OpenMetricsText1.0.0", "OpenMetricsText0.0.1", "PrometheusText0.0.4"]
        forward_to = [prometheus.remote_write.grafana_cloud_metrics.receiver]
      }
  alloy-singleton:
    presets: [singleton]
telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
