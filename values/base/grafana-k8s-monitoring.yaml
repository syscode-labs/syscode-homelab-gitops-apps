# Grafana Cloud destinations use the Omni-delivered grafana-cloud Secret.
cluster:
  name: unraid-lab

# Alloy node/log collectors require host mounts and NET_RAW, so this namespace
# must opt into the Pod Security level that permits those scoped capabilities.
extraObjects:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: monitoring
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged

destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: https://prometheus-prod-55-prod-gb-south-1.grafana.net/api/prom/push
    auth:
      type: basic
      usernameKey: metrics-username
      passwordKey: metrics-password
    secret:
      create: false
      name: grafana-cloud
      namespace: monitoring
  grafana-cloud-logs:
    type: loki
    url: https://logs-prod-035.grafana.net/loki/api/v1/push
    auth:
      type: basic
      usernameKey: logs-username
      passwordKey: logs-password
    secret:
      create: false
      name: grafana-cloud
      namespace: monitoring
clusterMetrics:
  enabled: true
  collector: alloy-metrics
  # Keep the stock allow-list ON (already true by default) and layer a drop
  # list on top, per scrape job. The goal is to stay within the Grafana Cloud
  # free tier (10k billable series, ~5-10% headroom). Billable series is the
  # PEAK over the billing window, so the per-pod state families (which mint +
  # die on every pod reconcile) and raw cAdvisor are the dominant churn.
  # Keep: workload aggregates (deployment / replicaset / statefulset /
  # daemonset / job / node / namespace / pvc / hpa / cronjob), node-level
  # kubelet, node-exporter, GX10/sglang, and kube_pod_container_status_restarts
  # _total (feeds the KubePodCrashLooping alert). Drop: all other per-pod KSM
  # state, configmap/secret (rotation churn), raw cAdvisor, and the kubelet
  # per-pod duration histograms. The chart-generated per-pod recording rules
  # (node_namespace_pod_container:*, namespace_workload_pod:*,
  # cluster:namespace:pod_*) feed off these raw metrics, so they self-extinguish.
  kube-state-metrics:
    metricsTuning:
      # Aggregates-only: replace the permissive stock allow-list with an
      # explicit keep list (RE2-safe). Drops every per-pod state metric,
      # configmap/secret rotation churn, and other KSM families we don't use.
      # kube_pod_container_status_restarts_total is kept — it feeds the
      # KubePodCrashLooping alert.
      useDefaultAllowList: false
      includeMetrics:
        - "kube_deployment.*"
        - "kube_replicaset.*"
        - "kube_statefulset.*"
        - "kube_daemonset.*"
        - "kube_job.*"
        - "kube_node.*"
        - "kube_namespace_status_phase"
        - "kube_persistentvolumeclaim.*"
        - "kube_persistentvolume.*"
        - "kube_horizontalpodautoscaler.*"
        - "kube_cronjob.*"
        - "kube_pod_container_status_restarts_total"
        - "kube_resourcequota"
  cadvisor:
    metricsTuning:
      # Raw per-container metrics. The recording-rule form carries the same
      # signal at the node level; dropping raw cuts the biggest live family.
      excludeMetrics:
        - "container_.*"
  kubelet:
    metricsTuning:
      # Per-pod kubelet duration histograms (pod worker / cgroup manager / pod
      # start latency). Node-level kubelet metrics are kept.
      excludeMetrics:
        - "kubelet_pod_worker_duration_seconds_(bucket|sum)"
        - "kubelet_cgroup_manager_duration_seconds_(bucket|sum)"
        - "kubelet_pod_start_duration_seconds_(bucket|sum)"
hostMetrics:
  enabled: true
  collector: alloy-metrics
clusterEvents:
  enabled: true
  collector: alloy-singleton
podLogsViaLoki:
  enabled: false
annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics
  namespaces: [kube-system]
  pods:
    enabled: false
  services:
    labelSelectors:
      k8s-app: hubble

collectors:
  alloy-metrics:
    presets: [clustered, statefulset]
    # Talos does not publish etcd as a Kubernetes Pod, so Grafana's etcd
    # integration cannot discover it. Retain only the two disk-latency
    # histograms from the three control-plane listeners; access is limited by
    # the accompanying Talos and Cilium policies.
    extraConfig: |
      prometheus.relabel "talos_etcd_disk_latency" {
        forward_to = [prometheus.remote_write.grafana_cloud_metrics.receiver]

        rule {
          action        = "keep"
          source_labels = ["__name__"]
          regex         = "etcd_disk_(wal_fsync|backend_commit)_duration_seconds(_bucket|_sum|_count)"
        }
      }

      prometheus.scrape "talos_etcd" {
        targets = [
          { "__address__" = "192.168.122.109:2383", "instance" = "unraid-lab-control-planes-gwvq7k", "job" = "integrations/etcd" },
          { "__address__" = "192.168.122.190:2383", "instance" = "unraid-lab-control-planes-hqf6vh", "job" = "integrations/etcd" },
          { "__address__" = "192.168.122.214:2383", "instance" = "unraid-lab-control-planes-htvzs7", "job" = "integrations/etcd" },
        ]
        scrape_interval = "60s"
        scrape_timeout = "10s"
        scrape_protocols = ["OpenMetricsText1.0.0", "OpenMetricsText0.0.1", "PrometheusText0.0.4"]
        forward_to = [prometheus.relabel.talos_etcd_disk_latency.receiver]
      }
  alloy-singleton:
    presets: [singleton]
telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
