# Layering ApplicationSet — the "chart-app" engine.
#
# ONE instance, hosted in unraid-lab's Argo CD (embedded via unraid-lab's Talos
# inline manifests). It covers BOTH clusters: oci-lab is reconciled remotely
# through the registered external cluster — oci-lab deliberately runs no local
# Argo CD. Application destinations differ per element (see the conditional in
# `destination` below): in-cluster server for unraid-lab, registered cluster
# name `oci-lab` for OCI.
#
# Selection (which apps run): three git generators —
#   apps/*/app.yaml                        shared (every cluster)
#   types/<clusterType>/apps/*/app.yaml    per cluster-TYPE
#   clusters/<clusterName>/apps/*/app.yaml per CLUSTER
# Values (override anything the chart exposes): deep-merge valueFiles —
#   values/base/<app>.yaml -> values/types/<type>/<app>.yaml -> values/clusters/<name>/<app>.yaml
# Custom ApplicationSets (e.g. arc-runners) are NOT chart-apps and run on the raw
# directory-sync lane (clusters/<name>/apps/*/application.yaml), not here.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:                                   # shared apps
        generators:
          - list:
              elements:
                - clusterName: unraid-lab
                  clusterType: homelab-kvm
                  destinationName: ""
                  destinationServer: https://kubernetes.default.svc
                - clusterName: oci-lab
                  clusterType: cloud
                  destinationName: oci-lab
                  destinationServer: ""
          - git:
              repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps
              revision: HEAD
              files:
                - path: apps/*/app.yaml
    - matrix:                                   # per cluster-TYPE apps
        generators:
          - list:
              elements:
                - clusterName: unraid-lab
                  clusterType: homelab-kvm
                  destinationName: ""
                  destinationServer: https://kubernetes.default.svc
                - clusterName: oci-lab
                  clusterType: cloud
                  destinationName: oci-lab
                  destinationServer: ""
          - git:
              repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps
              revision: HEAD
              files:
                - path: types/{{.clusterType}}/apps/*/app.yaml
    - matrix:                                   # per CLUSTER apps
        generators:
          - list:
              elements:
                - clusterName: unraid-lab
                  clusterType: homelab-kvm
                  destinationName: ""
                  destinationServer: https://kubernetes.default.svc
                - clusterName: oci-lab
                  clusterType: cloud
                  destinationName: oci-lab
                  destinationServer: ""
          - git:
              repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps
              revision: HEAD
              files:
                - path: clusters/{{.clusterName}}/apps/*/app.yaml
  template:
    metadata:
      name: "{{.path.basename}}"                # app name = its directory name
    spec:
      project: default
      sources:
        - repoURL: "{{.repoURL}}"
          chart: "{{.chart}}"
          targetRevision: "{{.version}}"
          helm:
            ignoreMissingValueFiles: true       # type/cluster value files are optional
            valueFiles:
              - $v/values/base/{{.path.basename}}.yaml
              - $v/values/types/{{.clusterType}}/{{.path.basename}}.yaml
              - $v/values/clusters/{{.clusterName}}/{{.path.basename}}.yaml
        - repoURL: https://github.com/syscode-labs/syscode-homelab-gitops-apps
          targetRevision: HEAD
          ref: v
      destination:
        # oci-lab has no in-cluster Argo: target the registered external
        # cluster by name. Its Secret lives in unraid-lab's argocd namespace
        # (clusters/unraid-lab/apps/oci-cluster-registration). Exactly one of
        # name/server is set per element — Argo resolves by name when server
        # is empty, by server when name is empty. The fields stay pure YAML:
        # ApplicationSet templates render AFTER YAML parsing, so conditional
        # KEYS are not possible here; per-element params keep it parseable.
        name: "{{ .destinationName }}"
        server: "{{ .destinationServer }}"
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Allow a CRD-owning chart to establish its custom resource type when
          # API discovery lags a cold-cluster bootstrap.
          - SkipDryRunOnMissingResource=true
