kind: Cluster
name: oci-lab
labels:
  environment: oci
kubernetes:
  # Not touched by the talos-images upgrade workflow — bump deliberately, one
  # minor at a time. Talos 1.14.x supports k8s 1.31–1.37 (SupportedKubernetesVersions=6
  # counting back from its 1.37.0 default), so this is valid as-is.
  version: v1.37.0-beta.0
talos:
  # Keep in step with installImage in omni/machine-classes/*.yaml.
  version: v1.14.0-beta.1
patches:
  - file: ../patches/cni-none.yaml
  - file: ../patches/disable-kube-proxy.yaml
  - file: ../patches/allow-scheduling.yaml
  - file: ../patches/oci-lab-inline-manifests.yaml
controlPlane:
  machineClass:
    name: oci-cp
    size: 1
workers:
  - machineClass:
      name: oci-worker
      size: 1
