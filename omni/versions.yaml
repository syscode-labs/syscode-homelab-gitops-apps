---
# Desired Talos / Kubernetes versions. HAND-OWNED — edit this file to upgrade.
#
# Build outputs (schematic_id, oci_image_ocid, installer and extension image
# refs) live in talos-image.yaml, which is rewritten wholesale by the
# talos-images build workflow. Never put desired versions there: that file
# records what has been built, not what is intended to run.
#
# Clusters inherit the global pin. A cluster entry overrides it.
#
# Kubernetes is never inherited across a diverging Talos target: a cluster that
# overrides `talos` without `kubernetes` derives its Kubernetes version from
# the supported versions of its own Talos target, not from the global pin.

talos: v1.14.0-rc.1
kubernetes: v1.36.3

clusters:
  # unraid-lab piloted 1.14 first (openspec: automate-talos-upgrade-pipeline,
  # task 8.3); the global pin has since caught up to match. Kept as an
  # explicit override, not removed, so this stays true even if the global
  # pin moves again independently.
  unraid-lab:
    talos: v1.14.0-rc.1
    kubernetes: v1.36.3

  # Never successfully bootstrapped — no live state to protect, no backup
  # gate needed. Inherits the global pin like any other cluster.
  oci-lab: {}
