# Cilium creates CiliumIdentity resources at runtime from workload labels.
# Exclude them globally so Argo CD never mistakes a generated identity for an
# application resource and attempts to prune it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: https://argocd-unraid-lab.wind-bearded.ts.net
  # PocketID SSO. Local `admin` login stays enabled (default, superuser,
  # bypasses RBAC) as the fallback — no key needed to keep it.
  # clientSecret comes from the argocd-pocketid-oidc Secret (populated by
  # Bitwarden Secrets Manager); it must carry app.kubernetes.io/part-of:
  # argocd or Argo CD won't resolve the $secretName:key reference — the
  # argocd-oidc-secrets app's PostSync hook Job applies that label.
  oidc.config: |
    name: PocketID
    issuer: https://auth.wind-bearded.ts.net
    clientID: 486304eb-eacb-4734-8551-b4a3016fc6ee
    clientSecret: $argocd-pocketid-oidc:clientSecret
    requestedScopes:
      - openid
      - profile
      - email
      - groups
    requestedIDTokenClaims:
      groups:
        essential: true
  # Argo CD 3 defaults to annotation tracking. Keep the established label
  # tracking during this upgrade so existing resources are not orphaned.
  application.resourceTrackingMethod: label
  resource.exclusions: |
    # Keep Argo CD 3's default high-churn exclusions while preserving the
    # pre-existing CiliumIdentity exclusion.
    - apiGroups:
        - ''
        - discovery.k8s.io
      kinds:
        - Endpoints
        - EndpointSlice
    - apiGroups:
        - coordination.k8s.io
      kinds:
        - Lease
    - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
      kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
    - apiGroups:
        - certificates.k8s.io
      kinds:
        - CertificateSigningRequest
    - apiGroups:
        - cert-manager.io
      kinds:
        - CertificateRequest
    - apiGroups:
        - cilium.io
      kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
    - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
      kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
      clusters:
        - "*"
