# Cilium creates CiliumIdentity resources at runtime from workload labels.
# Exclude them globally so Argo CD never mistakes a generated identity for an
# application resource and attempts to prune it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: https://argocd-unraid-lab.wind-bearded.ts.net
  # PocketID SSO. Local `admin` login stays enabled (default, superuser,
  # bypasses RBAC) as the fallback — no key needed to keep it.
  # clientSecret comes from the argocd-pocketid-oidc Secret (populated by
  # Bitwarden Secrets Manager); it must carry app.kubernetes.io/part-of:
  # argocd or Argo CD won't resolve the $secretName:key reference — the
  # argocd-oidc-secrets app's PostSync hook Job applies that label.
  oidc.config: |
    name: PocketID
    issuer: https://auth.wind-bearded.ts.net
    clientID: e8ae167f-f0c8-49c7-be92-0114a1ade320
    clientSecret: $argocd-pocketid-oidc:clientSecret
    enableUserInfoGroups: true
    # Tailscale issues this hostname from Let's Encrypt's Generation Y chain.
    # Root YE is not yet in standard operating-system trust stores.
    rootCA: |
      -----BEGIN CERTIFICATE-----
      MIIB2TCCAWCgAwIBAgIRAKQCa6LvbHwg1AR+XmWmk4AwCgYIKoZIzj0EAwMwLjEL
      MAkGA1UEBhMCVVMxDTALBgNVBAoTBElTUkcxEDAOBgNVBAMTB1Jvb3QgWUUwHhcN
      MjUwOTAzMDAwMDAwWhcNNDUwOTAyMjM1OTU5WjAuMQswCQYDVQQGEwJVUzENMAsG
      A1UEChMESVNSRzEQMA4GA1UEAxMHUm9vdCBZRTB2MBAGByqGSM49AgEGBSuBBAAi
      A2IABDwS/6vhrcVqcbBo+wgdI3fwn9x7DNJJOY/lTOti0vkwuRN87RhEhTH17E7X
      yFjWsPYhIPt/wzOqxTd2b+4ZJNy9ID04YywF9U5zasDVyGSNErVNtz8uSGh5izW8
      7j77GaNCMEAwDgYDVR0PAQH/BAQDAgEGMA8GA1UdEwEB/wQFMAMBAf8wHQYDVR0O
      BBYEFKPIJlqOoUzQNWP8myPIOq5W809WMAoGCCqGSM49BAMDA2cAMGQCMHhMr8N9
      LdL1VQKs9BdV81r76eXRB6mtjuNjzk6/lBsPNToWLTDzGYgtQKO1jl63uAIwGV7m
      onyF377c+MM1oqVNs17sgu7F9YKZwgLmVbeOMDbKAXHtKMDLbiGllCcs8f47
      -----END CERTIFICATE-----
    requestedScopes:
      - openid
      - profile
      - email
      - groups
    requestedIDTokenClaims:
      groups:
        essential: true
  # Argo CD 3 defaults to annotation tracking. Keep the established label
  # tracking during this upgrade so existing resources are not orphaned.
  application.resourceTrackingMethod: label
  resource.exclusions: |
    # Keep Argo CD 3's default high-churn exclusions while preserving the
    # pre-existing CiliumIdentity exclusion.
    - apiGroups:
        - ''
        - discovery.k8s.io
      kinds:
        - Endpoints
        - EndpointSlice
    - apiGroups:
        - coordination.k8s.io
      kinds:
        - Lease
    - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
      kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
    - apiGroups:
        - certificates.k8s.io
      kinds:
        - CertificateSigningRequest
    - apiGroups:
        - cert-manager.io
      kinds:
        - CertificateRequest
    - apiGroups:
        - cilium.io
      kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
    - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
      kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
      clusters:
        - "*"
