apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: "*"
    helm:
      valuesObject:
        oauth:
          clientId: ""      # set via Argo CD ApplicationSet or cluster secret
          clientSecret: ""  # set via Argo CD ApplicationSet or cluster secret
        proxyConfig:
          # Reuse the tag authorized for the operator; tag:k8s is not allowed
          # by this tailnet and prevents Ingress proxy provisioning.
          defaultTags: "tag:k8s-operator"
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
